[project]
name = "nba-legacy-backend"
version = "0.1.0"
description = "FastAPI backend for NBA Legacy Universe Tracker"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.29.0",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.1.19",
  "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "httpx>=0.27.0",
  "ruff>=0.4.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
